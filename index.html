        .toast { 
            position: fixed; bottom: 24px; right: 24px;

        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        
        .bg-banner { position: relative; overflow: hidden; }
        .bg-banner::before { 
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;

<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.initCloud = async function() {
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'chuyen-tau-12a1-v2';
                let firebaseConfig = null;
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    try { firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config; } catch (e) {}
                }
                
                if (!firebaseConfig) { window.useCloud = false; if(window.startApp) window.startApp(); return; }
                
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app); const db = getFirestore(app);
                
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
                
                if (!auth.currentUser) throw new Error("Authentication failed");

                window.cloudUser = auth.currentUser; 
                window.cloudDb = db; 
                window.cloudAppId = appId; 
                window.cloudDoc = doc; 
                window.cloudSetDoc = setDoc; 
                window.cloudOnSnapshot = onSnapshot; 

                window.sharedDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'classData', 'main');
                window.useCloud = true; if(window.startApp) window.startApp();
            } catch (e) { 
                console.warn("Lỗi kết nối Đám mây. Bật LocalStorage.", e); 
                window.useCloud = false; 
                if(window.startApp) window.startApp(); 
            }
        };
        setTimeout(() => window.initCloud(), 50);
    </script>

    <script>

        window.getTodayString = function() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
        window.currentAttendanceDate = window.getTodayString();

        window.getCurrentSchoolWeek = function() {
            const now = new Date(); const year = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear() - 1;
            const startSchool = new Date(year, 8, 1); const diffDays = Math.floor(Math.max(0, now - startSchool) / (1000 * 60 * 60 * 24));
            return Math.min(Math.max(1, Math.floor(diffDays / 7) + 1), 35);
        };

        window.escapeInlineJs = function(str) { return str ? String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '\\r') : ''; };
        window.escapeHtmlAttr = function(str) { return str ? String(str).replace(/"/g, '&quot;') : ''; };
        
        window.generateUniqueCode = function() { let code, attempts = 0; const currentStudents = Array.isArray(window.state.students) ? window.state.students : []; do { code = Math.floor(10000 + Math.random() * 90000).toString(); attempts++; } while (currentStudents.some(s => s.code === code) && attempts < 100); return code; };

        window.compressImage = function(file, callback, max_size = 300, quality = 0.8) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } } else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality)); 
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.customConfirm = function(message, onConfirmCallback) {
            const modalHtml = `
                <div class="fixed inset-0 bg-slate-900/80 z-[200] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="custom-confirm-modal">
                    <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm overflow-hidden flex flex-col p-6 text-center transform transition-all scale-100">
                        <div class="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-100"><i class="ph-fill ph-warning-circle text-4xl"></i></div>
                        <h3 class="font-black text-xl text-slate-800 mb-2">Xác nhận thao tác</h3>
                        <p class="text-slate-600 text-sm mb-6 font-medium leading-relaxed">${message}</p>
                        <div class="flex gap-3">
                            <button onclick="window.closeModal('custom-confirm-modal')" class="flex-1 py-3.5 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition-colors">Hủy</button>
                            <button id="custom-confirm-yes-btn" class="flex-1 py-3.5 bg-red-500 text-white font-bold rounded-xl shadow-md hover:bg-red-600 transition-all">Đồng ý</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('custom-confirm-yes-btn').onclick = () => { window.closeModal('custom-confirm-modal'); if (typeof onConfirmCallback === 'function') onConfirmCallback(); };
        };

        window.startApp = function() {
            try {
                if (window.useCloud && window.cloudDb && window.cloudUser && window.sharedDocRef) {
                    window.cloudOnSnapshot(window.sharedDocRef, (docSnap) => {
                        try {
                            if (docSnap.exists()) {
                                window.state = { ...window.state, ...docSnap.data().state };
                                window.applyStateDefaults();
                                if (!window.isDataLoaded) { window.isDataLoaded = true; window.renderLayout(); window.showToast("Đã kết nối và đồng bộ phòng học!", "success"); } else { window.renderLayout(); }
                            } else { window.fallbackLoad(true); }
                        } catch(e) { window.fallbackLoad(); }
                    }, (err) => { console.error("Snapshot error:", err); window.fallbackLoad(); });
                } else { window.fallbackLoad(); }
            } catch(e) { window.fallbackLoad(); }
        };

        window.fallbackLoad = function(isFirstCloudSync = false) {
            try {
                const savedData = localStorage.getItem('chuyen_tau_data');
                if (savedData) { window.state = { ...window.state, ...JSON.parse(savedData) }; window.applyStateDefaults(); } 
                else { window.applyStateDefaults(); window.saveData(); }
            } catch (err) { window.state = {}; window.applyStateDefaults(); window.saveData(); }
            window.isDataLoaded = true; window.renderLayout();
            if(isFirstCloudSync) { window.saveData(); window.showToast("Đã khởi tạo phòng học chung!", "success"); }
        };

        window.saveData = async function() { 
            if (window.useCloud && window.cloudDb && window.cloudUser && window.sharedDocRef) {
                try { await window.cloudSetDoc(window.sharedDocRef, { state: window.state }); } catch (e) { console.error("Save error:", e); localStorage.setItem('chuyen_tau_data', JSON.stringify(window.state)); }
            } else { localStorage.setItem('chuyen_tau_data', JSON.stringify(window.state)); }
        };

        window.applyStateDefaults = function() {
            if (!window.state || typeof window.state !== 'object') window.state = {};
            window.state.currentTab = window.state.currentTab || 'tong-quan';
            window.state.teacherPin = window.state.teacherPin || '123456';
            window.state.reportTab = window.state.reportTab || 'chi-tiet';
            window.state.settingsTab = window.state.settingsTab || 'thong-tin';
            window.state.attendanceTab = window.state.attendanceTab || 'diem-danh';
            if (!window.state.quickModeSelection) window.state.quickModeSelection = null;
            if (!window.state.attendanceRecords || typeof window.state.attendanceRecords !== 'object' || Array.isArray(window.state.attendanceRecords)) { window.state.attendanceRecords = {}; }
            if (!window.state.lockedWeeks || !Array.isArray(window.state.lockedWeeks)) window.state.lockedWeeks = [];
            if (!window.state.theme || typeof window.state.theme !== 'object') window.state.theme = { month: "CHỦ ĐIỂM THÁNG 9", title: "CHÀO MỪNG NĂM HỌC MỚI", bannerUrl: "", bannerColorClass: "from-[#1e1b4b] to-[#312e81]" };
            window.state.theme.bannerColorClass = window.state.theme.bannerColorClass || "from-[#1e1b4b] to-[#312e81]";
            if (!window.state.admin || typeof window.state.admin !== 'object') window.state.admin = { name: "Giáo Viên", role: "Giáo viên chủ nhiệm", avatarUrl: "", className: "LỚP HỌC", classAvatarUrl: "" };
            if (!window.state.settings || typeof window.state.settings !== 'object') window.state.settings = { sidebarPosition: 'left', deductStarsOnRedeem: true };
            if (!window.state.pointsForm || typeof window.state.pointsForm !== 'object') { window.state.pointsForm = { actionType: 'add', targetType: 'student', selectedTargetId: '', pointsVal: 0, category: 'Học tập', reason: '', note: '', week: window.getCurrentSchoolWeek() }; }
            window.state.pointsForm.week = window.state.pointsForm.week || window.getCurrentSchoolWeek();
            if (!Array.isArray(window.state.groups) || window.state.groups.length === 0) {
                window.state.groups = [
                    { id: "g1", name: "Tổ 1", color: "text-red-500", avatarUrl: "", pin: "1111" },
                    { id: "g2", name: "Tổ 2", color: "text-green-500", avatarUrl: "", pin: "2222" },

                    { id: "g4", name: "Tổ 4", color: "text-blueAccent", avatarUrl: "", pin: "4444" }
                ];
            } else { window.state.groups = window.state.groups.map((g, idx) => ({ ...g, pin: g.pin || String((idx + 1) * 1111) })); }

            if (!Array.isArray(window.state.rewards) || window.state.rewards.length === 0) {
                window.state.rewards = [
                    { id: 'r1', name: 'Đổi chỗ ngồi 1 ngày', cost: 10, icon: 'ph-seat', color: 'text-purple-600', bg: 'bg-purple-100', desc: 'Chọn chỗ ngồi yêu thích' },
                    { id: 'r2', name: 'Nhạc theo yêu cầu', cost: 20, icon: 'ph-music-notes', color: 'text-blueAccent', bg: 'bg-blue-100', desc: 'Bật bài hát yêu thích' },
                    { id: 'r3', name: 'Miễn làm bài tập', cost: 50, icon: 'ph-files', color: 'text-emerald-600', bg: 'bg-emerald-100', desc: 'Miễn 1 bài tập' },
                    { id: 'r4', name: 'Quà tặng bí mật', cost: 100, icon: 'ph-gift', color: 'text-orange-600', bg: 'bg-orange-100', desc: 'Nhận quà từ GV' }
                ];
            }

            if (!Array.isArray(window.state.students)) window.state.students = [];
            window.state.students = window.state.students.map((s, idx) => {
                if (!s || typeof s !== 'object') return null;
                return { ...s, id: s.id || (Date.now() + idx), name: s.name || "Học sinh", group: s.group || "Tổ 1", points: Number(s.points) || 0, stars: (s.stars !== undefined && !isNaN(Number(s.stars))) ? Number(s.stars) : (Number(s.points) || 0), code: s.code || window.generateUniqueCode(), history: Array.isArray(s.history) ? s.history : [] };
            }).filter(Boolean);

            if (!window.state.criteria || typeof window.state.criteria !== 'object') window.state.criteria = { positive: [], negative: [] };
            if (!Array.isArray(window.state.criteria.positive) || window.state.criteria.positive.length === 0 || window.state.criteria.positive.length === 4) {
                window.state.criteria.positive = [
                    { points: 1, reason: "Phát biểu/Lên bảng", category: "Học tập" }, { points: 2, reason: "Sửa bài khó", category: "Học tập" }, { points: 3, reason: "Tiến bộ điểm số", category: "Học tập" },
                    { points: 3, reason: "Đạt điểm 8", category: "Học tập" }, { points: 4, reason: "Đạt điểm 9", category: "Học tập" }, { points: 5, reason: "Đạt điểm 10", category: "Học tập" },
                    { points: 5, reason: "Tham gia HĐ Đoàn/CLB", category: "Phong trào" }, { points: 5, reason: "Học phụ đạo/HSG", category: "Học tập" }, { points: 3, reason: "Trực nhật sạch (khen)", category: "Nề nếp" }, { points: 5, reason: "Hành động đẹp", category: "Phong trào" }
                ];
            }
            if (!Array.isArray(window.state.criteria.negative) || window.state.criteria.negative.length === 0 || window.state.criteria.negative.length === 4) {
                window.state.criteria.negative = [
                    { points: 5, reason: "Vắng không phép", category: "Chuyên cần" }, { points: 1, reason: "Vắng có phép", category: "Chuyên cần" }, { points: 3, reason: "Đi trễ", category: "Chuyên cần" },
                    { points: 3, reason: "Sai tác phong/đồng phục", category: "Nề nếp" }, { points: 3, reason: "Việc riêng/Ăn vặt", category: "Kỷ luật" }, { points: 3, reason: "Đổi chỗ/Gây ồn ào", category: "Kỷ luật" },
                    { points: 2, reason: "Bị GV nhắc đích danh", category: "Kỷ luật" }, { points: 3, reason: "Ghi SĐB (Giờ Khá)", category: "Kỷ luật" }, { points: 4, reason: "Ghi SĐB (Giờ TB)", category: "Kỷ luật" },

                ];
            }
            window.state.criteria.positive.forEach(c => { if(!c.category) c.category = "Khác"; });
            window.state.criteria.negative.forEach(c => { if(!c.category) c.category = "Khác"; });
        };

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container'); const toast = document.createElement('div');
            toast.className = `toast ${type}`; toast.innerHTML = type === 'success' ? `<i class="ph-fill ph-check-circle text-xl"></i> <span>${message}</span>` : `<i class="ph-fill ph-warning-circle text-xl"></i> <span>${message}</span>`;
            container.appendChild(toast); setTimeout(() => { toast.classList.add('fadeOut'); setTimeout(() => toast.remove(), 300); }, 3000);
        };

        window.getAvatarImg = function(url, name, classes = "w-10 h-10") {
            const safeName = name || 'HS'; const seed = encodeURIComponent(safeName);
            const finalUrl = url || `https://api.dicebear.com/7.x/notionists/svg?seed=${seed}&backgroundColor=e0e7ff,fef08a,dcfce7,fee2e2`;
            return `<img src="${finalUrl}" class="${classes} rounded-full object-cover flex-shrink-0 border-2 border-white shadow-sm">`;
        };

        window.canAccess = function(minRole) {
            if (minRole === 'none') return true;
            if (minRole === 'leader') return window.currentRole === 'teacher' || window.currentRole === 'leader';
            if (minRole === 'teacher') return window.currentRole === 'teacher';
            return false;

            const rows = text.split('\n').map(row => row.split(/\t|,/)); window.processImportRows(rows);

        window.processImportRows = function(rows) {
            if (!rows || rows.length === 0) return window.showToast("File không có dữ liệu!", "error");
            let headerIdx = -1; let colName = -1, colLastName = -1, colFirstName = -1, colGender = -1, colGroup = -1;
            for (let r = 0; r < Math.min(rows.length, 15); r++) {
                const row = rows[r].map(c => c.toString().trim().toLowerCase());
                for (let c = 0; c < row.length; c++) {
                    const val = row[c];
                    if (val === 'họ và tên' || val === 'họ tên' || val === 'tên học sinh') colName = c;
                    if (val === 'họ và đệm' || val === 'họ đệm' || val === 'họ lót') colLastName = c;
                    if (val === 'tên') colFirstName = c;
                    if (val === 'giới tính' || val === 'phái' || val === 'nam/nữ') colGender = c;
                    if (val === 'tổ' || val === 'nhóm' || val === 'tổ thi đua') colGroup = c;
                }
                if (colName !== -1 || (colLastName !== -1 && colFirstName !== -1)) { headerIdx = r; break; }
            }

            let startRow = 0; if (headerIdx !== -1) startRow = headerIdx + 1;
            let addedCount = 0; let currentId = (window.state.students || []).length > 0 ? Math.max(...window.state.students.map(s => Number(s.id) || 0)) + 1 : 1;

            for (let i = startRow; i < rows.length; i++) {
                const row = rows[i]; if (!row || row.length === 0) continue;
                let fullName = ''; let gender = 'Nam'; let groupName = 'Tổ 1';
                if (headerIdx !== -1) {
                    if (colName !== -1 && row[colName]) { fullName = row[colName].toString().trim(); } 
                    else if (colLastName !== -1 && colFirstName !== -1) { fullName = `${(row[colLastName] || '').toString().trim()} ${(row[colFirstName] || '').toString().trim()}`.trim(); }
                    if (colGender !== -1 && row[colGender]) gender = row[colGender].toString().trim();
                    if (colGroup !== -1 && row[colGroup]) groupName = row[colGroup].toString().trim();
                } else {
                    const firstCell = (row[0] || '').toString().trim();
                    if (!isNaN(firstCell) && firstCell !== '' && row.length > 1) { fullName = (row[1] || '').toString().trim(); gender = (row[2] || '').toString().trim() || 'Nam'; groupName = (row[3] || '').toString().trim() || 'Tổ 1'; } 
                    else { fullName = firstCell; gender = (row[1] || '').toString().trim() || 'Nam'; groupName = (row[2] || '').toString().trim() || 'Tổ 1'; }
                }

                if (!fullName || !isNaN(fullName) || fullName.toLowerCase().includes('tổng số') || fullName.toLowerCase().includes('giáo viên')) continue;
                const gLower = gender.toLowerCase(); if (gLower === 'nữ' || gLower === 'nu' || gLower === 'female' || gLower === '0') gender = 'Nữ'; else gender = 'Nam';
                if (!isNaN(groupName) && groupName.length === 1) { groupName = 'Tổ ' + groupName; }

                if (!window.state.groups.find(g => g.name.toLowerCase() === groupName.toLowerCase())) {
                    const newGroupId = 'g' + Date.now() + Math.floor(Math.random() * 1000); const basePinDigit = (window.state.groups.length + 1) % 9 || 9;
                    window.state.groups.push({ id: newGroupId, name: groupName, color: "text-slate-500", avatarUrl: "", pin: String(basePinDigit).repeat(4) });
                }
                const matchedGroup = window.state.groups.find(g => g.name.toLowerCase() === groupName.toLowerCase()); const finalGroupName = matchedGroup ? matchedGroup.name : groupName;
                window.state.students.push({ id: currentId++, name: fullName, gender: gender, group: finalGroupName, role: (row[3] || '').toString().trim() || 'Học sinh', goal: (row[4] || '').toString().trim() || '', talent: (row[5] || '').toString().trim() || '', avatarUrl: '', points: 0, stars: 0, code: window.generateUniqueCode(), history: [] });
                addedCount++;
            }
            if (addedCount > 0) { window.saveData(); window.renderLayout(); window.closeModal('import-modal'); window.showToast(`Đã thêm thành công ${addedCount} học sinh vào lớp!`, "success"); window.triggerConfetti(); } else { window.showToast("Không tìm thấy dữ liệu học sinh hợp lệ.", "error"); }

        window.triggerConfetti = function() {
            const canvas = document.getElementById('confetti-canvas'); if (!canvas) return; const container = document.getElementById('main-container'); if(!container) return;
            canvas.width = container.offsetWidth; canvas.height = container.offsetHeight; const ctx = canvas.getContext('2d');
            const particles = [], colors = ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];
            for (let i = 0; i < 80; i++) particles.push({ x: canvas.width/2, y: canvas.height/2+50, r: Math.random()*6+2, dx: Math.random()*16-8, dy: Math.random()*-15-5, color: colors[Math.floor(Math.random()*colors.length)], tilt: Math.floor(Math.random()*10)-10, tiltAngleInc: (Math.random()*0.07)+0.05, tiltAngle: 0 });
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height); let active = 0;
                particles.forEach(p => { if (p.y < canvas.height) active++; p.tiltAngle += p.tiltAngleInc; p.y += (Math.cos(p.tiltAngle) + p.dy + p.r/2)/2; p.x += Math.sin(p.tiltAngle)*2 + p.dx; p.dy += 0.2; ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color; ctx.moveTo(p.x+p.tilt+p.r, p.y); ctx.lineTo(p.x+p.tilt, p.y+p.tilt+p.r); ctx.stroke(); });
                if (active > 0) requestAnimationFrame(render); else ctx.clearRect(0, 0, canvas.width, canvas.height);
            } render();
        };

            document.getElementById('modal-container').innerHTML = `

                    <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-md overflow-hidden flex flex-col p-8">
                        <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-100 text-indigo-600"><i class="ph-fill ph-users-three text-3xl"></i></div>
                        <h3 class="font-black text-2xl text-slate-800 mb-6 text-center">Chấm Điểm Cả Lớp</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">Số điểm (Dương để cộng, Âm để trừ)</label>
                                <input type="number" id="award-all-val" class="w-full px-5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-base font-black outline-none focus:border-indigo-500" value="0">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">Lý do</label>
                                <input type="text" id="award-all-reason" class="w-full px-5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-indigo-500" placeholder="Ví dụ: Hoạt động tập thể...">
                            </div>
                        </div>
                        <div class="flex gap-3 pt-6 mt-2">
                            <button onclick="window.closeModal('award-all-modal')" class="flex-1 py-4 bg-slate-100 rounded-xl font-bold text-slate-600 hover:bg-slate-200 transition-colors">HỦY</button>
                            <button onclick="window.executeAwardAll()" class="flex-1 py-4 bg-indigo-600 text-white font-black rounded-xl shadow-md hover:bg-indigo-700 transition-all">ÁP DỤNG</button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.executeAwardAll = function() {
            const val = parseInt(document.getElementById('award-all-val').value);
            const reason = document.getElementById('award-all-reason').value.trim();
            if (isNaN(val) || val === 0 || !reason) { window.showToast("Vui lòng nhập điểm và lý do hợp lệ!", "error"); return; }
            const week = window.state.pointsForm.week || window.getCurrentSchoolWeek(); const dateStr = new Date().toISOString();
            
            window.state.students.forEach(s => {
                s.points = (s.points || 0) + val; s.stars = Math.max(0, (s.stars || 0) + val);
                if (!s.history) s.history = []; s.history.push({ id: 'h' + Date.now() + Math.floor(Math.random() * 1000) + s.id, points: val, reason: reason, category: 'Khác', date: dateStr, week: week });
            });
            window.saveData(); window.renderLayout(); window.closeModal('award-all-modal'); window.showToast("Đã chấm điểm cho cả lớp!", "success");
        };

        window.onload = function() { if(!window.useCloud) window.fallbackLoad(); };
    </script>
     <style>
        @media (max-width: 768px) {
            /* Ép menu ẩn đi và trượt từ trái sang */
            aside {
                position: fixed !important;
                top: 0; left: 0; bottom: 0;
                z-index: 999 !important;
                transform: translateX(-100%);
                transition: transform 0.3s ease-in-out;
            }
            /* Hiện menu khi được bấm */
            aside.mobile-open {
                transform: translateX(0);
            }
            /* Chỉnh lại Header cho vừa điện thoại */
            header h2 {
                font-size: 16px !important;
                display: block !important;
                max-width: 140px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            header {
                padding: 12px 16px !important;
            }
            /* Lớp phủ đen mờ khi mở menu */
            #mobile-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 998;
            }
            #mobile-overlay.mobile-open {
                display: block;
            }
        }
    </style>
    <script>
        const originalRenderLayout = window.renderLayout;
        window.renderLayout = function() {
            // Chạy giao diện gốc trước
            originalRenderLayout();
            
            // Xử lý thêm các nút bấm di động sau khi giao diện đã tải
            const aside = document.querySelector('aside');
            const header = document.querySelector('header');
            
            if (aside && header) {
                // 1. Thêm nút Menu 3 gạch vào Header
                const leftDiv = header.querySelector('div');
                if (leftDiv && !document.getElementById('mobile-menu-btn')) {
                    const menuBtn = document.createElement('button');
                    menuBtn.id = 'mobile-menu-btn';
                    menuBtn.className = 'md:hidden mr-3 p-2 bg-white rounded-xl shadow-sm border border-slate-200 text-slate-700';
                    menuBtn.innerHTML = '<i class="ph-bold ph-list text-xl"></i>';
                    menuBtn.onclick = function() {
                        aside.classList.add('mobile-open');
                        let overlay = document.getElementById('mobile-overlay');
                        if(overlay) overlay.classList.add('mobile-open');
                    };
                    leftDiv.insertBefore(menuBtn, leftDiv.firstChild);
                }

                // 2. Thêm nút Đóng (X) vào trong Menu Sidebar
                if (!document.getElementById('mobile-close-btn')) {
                    const closeBtn = document.createElement('button');
                    closeBtn.id = 'mobile-close-btn';
                    closeBtn.className = 'md:hidden absolute top-4 right-4 text-white bg-white/20 p-2 rounded-full z-50';
                    closeBtn.innerHTML = '<i class="ph-bold ph-x text-xl"></i>';
                    closeBtn.onclick = function() {
                        aside.classList.remove('mobile-open');
                        let overlay = document.getElementById('mobile-overlay');
                        if(overlay) overlay.classList.remove('mobile-open');
                    };
                    aside.insertBefore(closeBtn, aside.firstChild);
                }

                // 3. Thêm lớp phủ mờ (Overlay)
                if (!document.getElementById('mobile-overlay')) {
                    const overlay = document.createElement('div');
                    overlay.id = 'mobile-overlay';
                    overlay.onclick = function() {
                        aside.classList.remove('mobile-open');
                        this.classList.remove('mobile-open');
                    };
                    document.body.appendChild(overlay);
                }

                // 4. Tự động đóng menu khi thầy bấm chọn các chức năng bên trong
                const menuItems = aside.querySelectorAll('button');
                menuItems.forEach(item => {
                    item.addEventListener('click', () => {
                        aside.classList.remove('mobile-open');
                        let overlay = document.getElementById('mobile-overlay');
                        if(overlay) overlay.classList.remove('mobile-open');
                    });
                });
            }
        };
        
        // Ép app tải lại với giao diện mới ngay lập tức
        setTimeout(() => { if (typeof window.renderLayout === 'function') window.renderLayout(); }, 500);
    </script>
    <script>
        // 1. Cho phép hiển thị đủ tên ở mục "Tổ thi đua"
        const oldRenderViewNhomThiDua = window.renderViewNhomThiDua;
        window.renderViewNhomThiDua = function() {
            let html = oldRenderViewNhomThiDua();
            // Xóa lệnh cắt chữ (truncate) và ép tự động xuống dòng (whitespace-normal)
            return html.replace(/truncate mb-0\.5/g, 'mb-0.5 whitespace-normal');
        };

        // 2. Cho phép hiển thị đủ tên ở mục "Học sinh"
        const oldRenderViewHocSinh = window.renderViewHocSinh;
        window.renderViewHocSinh = function() {
            let html = oldRenderViewHocSinh();
            return html.replace(/truncate leading-tight/g, 'leading-tight whitespace-normal');
        };
        
        // Tự động làm mới giao diện
        setTimeout(() => { if (typeof window.renderLayout === 'function') window.renderLayout(); }, 600);
    </script>
 <script>
        // 1. Thêm nút "Các bạn thi môn Sinh" vào danh sách Vòng quay
        const oldRenderViewVongQuay_Sinh = window.renderViewVongQuay;
        window.renderViewVongQuay = function() {
            let html = oldRenderViewVongQuay_Sinh();
            return html.replace(
                "{ id: 'low_points', label: '📈 Học sinh cần gỡ điểm' }", 
                "{ id: 'low_points', label: '📈 Học sinh cần gỡ điểm' }, { id: 'mon_sinh', label: '🧬 Các bạn thi môn Sinh' }"
            );
        };

        // 2. Logic trích xuất các bạn có chữ "Sinh"
        const oldInitPickerCards_Sinh = window.initPickerCards;
        window.initPickerCards = function() {
            if (window.pickerType === 'mon_sinh') {
                const stage = document.getElementById('picker-stage'); 
                if (!stage) return; 
                stage.innerHTML = ''; 
                
                // Tìm các học sinh có chữ "Sinh" trong Vai trò, Mục tiêu hoặc Năng khiếu
                let listItems = window.state.students.filter(s => {
                    const r = (s.role || '').toLowerCase();
                    const g = (s.goal || '').toLowerCase();
                    const t = (s.talent || '').toLowerCase();
                    return r.includes('sinh') || g.includes('sinh') || t.includes('sinh');
                });
                
                // Báo lỗi thân thiện nếu chưa có ai
                if(!listItems || listItems.length === 0) { 
                    stage.innerHTML = `<div class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 text-slate-500"><i class="ph-fill ph-warning-circle text-6xl text-yellow-500 mb-4 animate-bounce-slight"></i><div class="text-xl font-black mb-2 text-slate-700">Chưa tìm thấy học sinh nào!</div><div class="text-sm font-medium">Bạn hãy vào mục <b>Học sinh</b> -> Chọn Sửa -> Gõ thêm chữ <b>Sinh</b> vào ô <b>Vai trò</b> (VD: <i>Thi Sinh</i>) cho các em nhé.</div></div>`; 
                    return; 
                }
                
                // Hiển thị vòng quay
                window.pickerItems = listItems.map((item) => { 
                    const el = document.createElement('div'); 
                    el.className = `absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl p-3 shadow-lg flex flex-col items-center justify-center gap-2 border border-slate-100 will-change-transform z-10`; 
                    el.style.width = '110px'; el.style.height = '130px'; 
                    let avatarHtml = window.getAvatarImg(item.avatarUrl, item.name, "w-16 h-16 pointer-events-none ring-4 ring-white"); 
                    el.innerHTML = `<div class="rounded-full p-1 bg-slate-100">${avatarHtml}</div><div class="text-xs font-black text-slate-800 text-center w-full truncate pointer-events-none">${item.name}</div>`; 
                    stage.appendChild(el); 
                    return { el: el, data: item, x: (Math.random() - 0.5) * (stage.offsetWidth - 150), y: (Math.random() - 0.5) * (stage.offsetHeight - 150), angle: Math.random() * Math.PI * 2, speed: 0.8 + Math.random() }; 
                });
            } else {
                oldInitPickerCards_Sinh();
            }
        };

        // Tự động làm mới
        setTimeout(() => { if (typeof window.renderLayout === 'function') window.renderLayout(); }, 700);
    </script>
